<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin | C&G Servicio Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex items-center justify-center min-h-screen m-0">

    <div class="max-w-md w-full bg-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-white mb-2">Acceso al Panel</h2>
            <p class="text-slate-400 text-sm">C&G Servicio Técnico</p>
        </div>

        <form onsubmit="validarLogin(event)">
            <div class="mb-4">
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Usuario</label>
                <input type="text" id="admin-user" required class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-blue-600">
            </div>
            <div class="mb-6">
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Contraseña</label>
                <input type="password" id="admin-pass" required class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-blue-600">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm transition">
                Ingresar al Panel
            </button>
        </form>
    </div>

    <script>
        // Al cargar el login, borramos cualquier sesión previa para forzar el ingreso limpio
        localStorage.removeItem('auth_cg');

        function validarLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('admin-user').value.trim();
            const password = document.getElementById('admin-pass').value.trim();

            if (usuario === 'admin_cg' && password === 'tecnico2026') {
                localStorage.setItem('auth_cg', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        }
    </script>
</body>
</html>
