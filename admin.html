<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Avanzado - C&G</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- Header del Admin -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center space-x-2">
                <i class="fa-solid fa-gauge-high text-blue-500"></i>
                <span>Panel Profesional | C&G Servicio Técnico</span>
            </h1>
            <div class="flex items-center space-x-3">
                <span id="badge-nuevo" class="hidden bg-green-500 text-white text-xs px-2.5 py-1 rounded-full font-bold animate-pulse">¡Nueva solicitud!</span>
                <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Encabezado y Resumen -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h2 class="text-2xl font-extrabold text-slate-900">Gestión de Visitas Técnicas</h2>
                <p class="text-slate-600 text-sm mt-1">Administra los clientes, busca registros y exporta tus datos.</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="exportarCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow flex items-center space-x-2 transition">
                    <i class="fa-solid fa-file-excel"></i>
                    <span>Exportar a CSV</span>
                </button>
                <div class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow">
                    Total: <span id="cant-total">0</span>
                </div>
            </div>
        </div>

        <!-- Barra de Búsqueda y Filtros por Estado -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <!-- Buscador -->
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="input-buscar" onkeyup="filtrarPedidos()" placeholder="Buscar por cliente, teléfono o equipo..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-blue-600">
            </div>

            <!-- Botones de Filtro -->
            <div class="flex items-center space-x-2 w-full md:w-auto">
                <button onclick="cambiarFiltro('todos')" id="btn-filtro-todos" class="flex-1 md:flex-none px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition">Todos</button>
                <button onclick="cambiarFiltro('Pendiente')" id="btn-filtro-pendientes" class="flex-1 md:flex-none px-4 py-2 rounded-xl text-xs font-bold bg-slate-200 text-slate-700 hover:bg-slate-300 transition">Pendientes</button>
                <button onclick="cambiarFiltro('Atendido')" id="btn-filtro-atendidos" class="flex-1 md:flex-none px-4 py-2 rounded-xl text-xs font-bold bg-slate-200 text-slate-700 hover:bg-slate-300 transition">Atendidos</button>
            </div>
        </div>

        <!-- Tabla de Pedidos -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-800 text-white text-xs uppercase tracking-wider">
                            <th class="p-4">Fecha</th>
                            <th class="p-4">Cliente / Teléfono</th>
                            <th class="p-4">Equipo</th>
                            <th class="p-4">Dirección</th>
                            <th class="p-4">Referencia / Falla</th>
                            <th class="p-4 text-center">Estado</th>
                            <th class="p-4 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-pedidos" class="divide-y divide-slate-200">
                        <!-- Se llena dinámicamente con JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <!-- Mensaje si no hay registros -->
            <div id="sin-registros" class="p-12 text-center text-slate-500 hidden">
                <i class="fa-solid fa-inbox text-4xl mb-3 text-slate-300"></i>
                <p class="font-medium">No se encontraron solicitudes con los filtros seleccionados.</p>
            </div>
        </div>

    </main>

    <!-- Script del Panel Avanzado -->
    <script>
        if (localStorage.getItem('auth_cg') !== 'true') {
            window.location.href = 'login.html';
        }

        let filtroActual = 'todos';
        let cantidadAnterior = JSON.parse(localStorage.getItem('pedidos_cg'))?.length || 0;

        function cargarTabla() {
            const pedidos = JSON.parse(localStorage.getItem('pedidos_cg')) || [];
            const tbody = document.getElementById('tabla-pedidos');
            const sinReg = document.getElementById('sin-registros');
            const textoBusqueda = document.getElementById('input-buscar').value.toLowerCase();
            
            document.getElementById('cant-total').innerText = pedidos.length;

            // Alerta visual si entra un pedido nuevo estando en el panel
            if (pedidos.length > cantidadAnterior) {
                document.getElementById('badge-nuevo').classList.remove('hidden');
                cantidadAnterior = pedidos.length;
            }

            // Filtrar por estado y buscador
            const pedidosFiltrados = pedidos.filter(p => {
                const coincideEstado = (filtroActual === 'todos' || p.estado === filtroActual);
                const coincideTexto = p.nombre.toLowerCase().includes(textoBusqueda) || 
                                      p.telefono.includes(textoBusqueda) || 
                                      p.equipo.toLowerCase().includes(textoBusqueda) ||
                                      p.direccion.toLowerCase().includes(textoBusqueda);
                return coincideEstado && coincideTexto;
            });

            tbody.innerHTML = '';

            if (pedidosFiltrados.length === 0) {
                sinReg.classList.remove('hidden');
                return;
            } else {
                sinReg.classList.add('hidden');
            }

            pedidosFiltrados.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                const esAtendido = p.estado === 'Atendido';

                tr.innerHTML = `
                    <td class="p-4 text-xs text-slate-500 font-mono">${p.fecha}</td>
                    <td class="p-4 font-bold text-slate-900">
                        ${p.nombre}<br>
                        <a href="https://wa.me/51${p.telefono}" target="_blank" class="text-green-600 font-normal hover:underline text-xs flex items-center mt-1">
                            <i class="fa-brands fa-whatsapp mr-1"></i> ${p.telefono}
                        </a>
                    </td>
                    <td class="p-4"><span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold">${p.equipo}</span></td>
                    <td class="p-4 text-slate-700">${p.direccion}</td>
                    <td class="p-4 text-slate-600 text-xs max-w-xs">${p.referencia}</td>
                    <td class="p-4 text-center">
                        <button onclick="cambiarEstado(${p.id})" class="px-3 py-1 rounded-full text-xs font-bold transition ${esAtendido ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                            ${p.estado}
                        </button>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="eliminarPedido(${p.id})" class="text-red-500 hover:text-red-700 font-bold text-xs p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function cambiarFiltro(estado) {
            filtroActual = estado;
            
            // Cambiar estilos de botones de filtro
            document.getElementById('btn-filtro-todos').className = `flex-1 md:flex-none px-4 py-2 rounded-xl text-xs font-bold transition ${estado === 'todos' ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}`;
            document.getElementById('btn-filtro-pendientes').className = `flex-1 md:flex-none px-4 py-2 rounded-xl text-xs font-bold transition ${estado === 'Pendiente' ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}`;
            document.getElementById('btn-filtro-atendidos').className = `flex-1 md:flex-none px-4 py-2 rounded-xl text-xs font-bold transition ${estado === 'Atendido' ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}`;

            cargarTabla();
        }

        function filtrarPedidos() {
            cargarTabla();
        }

        function cambiarEstado(id) {
            let pedidos = JSON.parse(localStorage.getItem('pedidos_cg')) || [];
            pedidos = pedidos.map(p => {
                if (p.id === id) {
                    p.estado = p.estado === 'Pendiente' ? 'Atendido' : 'Pendiente';
                }
                return p;
            });
            localStorage.setItem('pedidos_cg', JSON.stringify(pedidos));
            cargarTabla();
        }

        function eliminarPedido(id) {
            if (confirm('¿Deseas eliminar este registro de cliente?')) {
                let pedidos = JSON.parse(localStorage.getItem('pedidos_cg')) || [];
                pedidos = pedidos.filter(p => p.id !== id);
                localStorage.setItem('pedidos_cg', JSON.stringify(pedidos));
                cargarTabla();
            }
        }

        function exportarCSV() {
            const pedidos = JSON.parse(localStorage.getItem('pedidos_cg')) || [];
            if (pedidos.length === 0) {
                alert('No hay datos para exportar.');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Fecha,Cliente,Telefono,Equipo,Direccion,Referencia,Estado\n";
            pedidos.forEach(p => {
                csvContent += `"${p.fecha}","${p.nombre}","${p.telefono}","${p.equipo}","${p.direccion}","${p.referencia}","${p.estado}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "solicitudes_cg_servicio.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function cerrarSesion() {
            localStorage.removeItem('auth_cg');
            window.location.href = 'login.html';
        }

        // Revisar si hay nuevos pedidos cada 4 segundos automáticamente
        setInterval(() => {
            const pedidosActuales = JSON.parse(localStorage.getItem('pedidos_cg')) || [];
            if (pedidosActuales.length > cantidadAnterior) {
                document.getElementById('badge-nuevo').classList.remove('hidden');
                cantidadAnterior = pedidosActuales.length;
                cargarTabla();
            }
        }, 4000);

        cargarTabla();
    </script>
</body>
</html>
